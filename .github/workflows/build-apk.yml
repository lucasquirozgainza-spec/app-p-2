name: Compilar APK CondoControl Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generar carpeta android (scaffold)
        run: |
          flutter create --platforms=android --org com.condocontrol --project-name condocontrol _scaffold
          cp -r _scaffold/android ./android
          cp -f _scaffold/.metadata ./.metadata || true
          rm -rf _scaffold

      - name: Inyectar permisos y nombre de app
        run: python3 tools/patch_android.py

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CondoControlPro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
