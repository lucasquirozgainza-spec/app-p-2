name: condocontrol
description: CondoControl Pro - Gestion de condominios (LIMCO II / Millennial)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.5
  intl: ^0.19.0
  image: ^4.2.0
