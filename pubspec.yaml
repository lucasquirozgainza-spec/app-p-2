  file_picker: ^8.1.6
  open_filex: ^4.5.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  supabase_flutter: ^2.8.0
  pdf: ^3.11.1
  camera: ^0.11.0+2
  share_plus: ^10.1.2
  google_mlkit_text_recognition: ^0.13.1
  battery_plus: ^6.0.2
  device_info_plus: ^10.1.2
