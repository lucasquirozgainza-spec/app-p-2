# Alternativa a GitHub Actions: compilar en Codemagic (codemagic.io).
# Conecta tu repositorio y selecciona este workflow.
workflows:
  condocontrol-apk:
    name: CondoControl Pro APK
    max_build_duration: 30
    environment:
      flutter: 3.27.4
      java: 17
    scripts:
      - name: Generar carpeta android
        script: |
          flutter create --platforms=android --org com.condocontrol --project-name condocontrol _scaffold
          cp -r _scaffold/android ./android
          rm -rf _scaffold
      - name: Inyectar permisos
        script: python3 tools/patch_android.py
      - name: Dependencias
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
